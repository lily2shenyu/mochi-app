plugins {
    id 'com.android.application'
}

android {
    namespace 'com.lilidreamlove.mochi'
    compileSdk 34

    signingConfigs {
        mochi {
            storeFile file('../keystore/mochi.keystore')
            storePassword 'lilidreamlove'
            keyAlias 'lilidreamlove'
            keyPassword 'lilidreamlove'
        }
    }

    defaultConfig {
        applicationId "com.lilidreamlove.mochi"
        minSdk 24
        targetSdk 34
        versionCode 2
        versionName "1.1"
    }
    buildTypes {
        debug {
            signingConfig signingConfigs.mochi
        }
        release {
            signingConfig signingConfigs.mochi
            minifyEnabled false
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
